# Uso: docker compose -f docker-compose.dev.yml up -d
# Entorno V2 aislado: postgres-dev :5433 + backend v2
# Requiere rama v2-experimental: git checkout v2-experimental
services:
  postgres:
    image: postgres:16-alpine
    container_name: soporte-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: soporte
      POSTGRES_USER: soporte
      POSTGRES_PASSWORD: soporte_segura_2025
    ports:
      - "5433:5432"
    volumes:
      - soporte-postgres-dev-data:/var/lib/postgresql/data
    networks:
      - soporte-network
  backend:
    build:
      context: ./backend/SoporteTecnico.API
      dockerfile: Dockerfile
    container_name: soporte-backend-dev
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "5001:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=soporte-postgres-dev;Port=5432;Database=soporte;User Id=soporte;Password=soporte_segura_2025;Include Error Detail=true"
    networks:
      - soporte-network
networks:
  soporte-network:
    name: soporte_tecnico_dev-network
volumes:
  soporte-postgres-dev-data:
    name: soporte_tecnico_soporte-postgres-dev-data
    external: true
