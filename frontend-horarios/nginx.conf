# Serves the built Angular SPA and proxies the FastAPI backend under /api.
server {
    listen 4213;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Photo uploads are capped at 5 MB by the API (fotos.MAX_BYTES); leave
    # headroom for multipart overhead so FastAPI, not nginx, returns the 413.
    client_max_body_size 10m;

    location /api/ {
        # No URI on proxy_pass: the original /api/... path is forwarded as-is.
        proxy_pass http://api:5013;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
    }

    # Content-hashed bundles (outputHashing: all) never change in place.
    location ~* \.(?:js|css|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
