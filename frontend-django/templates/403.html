<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sin permiso (403) — Soporte Técnico</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f2937;padding:24px}.card{max-width:480px;width:100%;background:#fff;border-radius:16px;padding:40px 32px;text-align:center;box-shadow:0 12px 40px rgba(15,23,42,.12)}.emoji{font-size:56px}.code{display:inline-block;margin:12px 0 4px;font-size:13px;font-weight:700;color:#fff;background:#8b5cf6;border-radius:999px;padding:4px 14px}h1{font-size:22px;margin:8px 0}p{color:#6b7280;font-size:15px;line-height:1.6}.btns{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}a.btn{display:inline-block;padding:12px 22px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none}a.pri{background:#2563eb;color:#fff}a.sec{background:#eef2ff;color:#3730a3}
</style>
</head>
<body>
<main class="card">
<div class="emoji">🔒</div>
<span class="code">Error 403</span>
<h1>No tenés permiso para ver esto</h1>
<p>Si necesitás acceso, pedilo con el botón y lo revisamos.</p>
<div class="btns">
<a class="btn pri" id="reportar" href="/sugerencias/">Pedir acceso</a>
<a class="btn sec" href="/">Volver al inicio</a>
</div>
</main>
<script>
document.getElementById("reportar").href =
  "/sugerencias/?texto=" + encodeURIComponent("Necesito acceso (403) a " + location.pathname + ": ");
</script>
</body>
</html>
