{% extends "atenciones/base.html" %}
{% block titulo %}Entrar — Soporte Técnico{% endblock %}
{% block contenido %}
<div class="page">
  <div class="card">
    <h1>Entrar</h1>
    <p class="sub">Soporte Técnico UPDS</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_email">Correo</label>
      {{ form.email }}
      <label for="id_password">Contraseña</label>
      {{ form.password }}
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
