<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Soporte Técnico{% endblock %}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_version }}">
<link rel="stylesheet" href="/static/css/navbar.css?v={{ asset_version }}">
<link rel="stylesheet" href="/static/css/wilmercito.css?v={{ asset_version }}">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" async></script>
<script>
(function () {
  var prefs = {};
  try { prefs = JSON.parse(localStorage.getItem("a11y") || "{}") || {}; } catch (e) { prefs = {}; }
  var raiz = document.documentElement;
  if (prefs.letra === "grande") raiz.classList.add("a11y-letra-grande");
  if (prefs.letra === "xl") raiz.classList.add("a11y-letra-xl");
  if (prefs.contraste === "alto") raiz.classList.add("a11y-contraste-alto");
  if (prefs.movimiento === "reducido") raiz.classList.add("a11y-sin-movimiento");
})();
</script>
</head>
<body data-page="{{ nav_page|default:'' }}">
{% if usuario %}{% include "atenciones/_navbar.html" %}{% endif %}
<main class="content{% if usuario %} with-nav{% endif %}">{% block contenido %}{% endblock %}</main>
{% if usuario %}{% include "atenciones/_wilmercito.html" %}{% endif %}
<script src="/static/js/navbar.js?v={{ asset_version }}" defer></script>
<script src="/static/js/jerarquia.js?v={{ asset_version }}" defer></script>
<script src="/static/js/accesibilidad.js?v={{ asset_version }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
