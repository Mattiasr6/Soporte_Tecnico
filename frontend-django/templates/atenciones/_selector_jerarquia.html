<div class="ruta3" data-ruta3
     data-padre="{{ edit_item.grupo_padre_id }}"
     data-grupo="{{ edit_item.grupo_id }}"
     data-area="{{ edit_item.area_id }}">
  <script type="application/json" class="arbol-data">{{ arbol_json|safe }}</script>
  <script type="application/json" class="conteos-data">{{ conteos_json|default:"{}"|safe }}</script>

  <label for="filtro-area">Área</label>
  <div class="selector-jerarquia">
    <input type="text" id="filtro-area" class="filtro-arbol" autocomplete="off"
           placeholder="Escribí para filtrar: sistemas, aula b, vicerrectorado…">
    <div class="arbol" role="tree" aria-label="Sector, dependencia y área"></div>
  </div>

  <p class="ruta-elegida" hidden>
    <span class="ruta-texto"></span>
    <button type="button" class="link-btn" data-cambiar-area>Cambiar</button>
  </p>
  <p class="error" data-error-area hidden>Elegí un área o dependencia de la lista.</p>

  <input type="hidden" name="grupo_padre_id" data-rol="padre" value="{{ edit_item.grupo_padre_id|default:'' }}">
  <input type="hidden" name="grupo_id" data-rol="grupo" value="{{ edit_item.grupo_id|default:'' }}">
  <input type="hidden" name="area_id" data-rol="area" value="{{ edit_item.area_id|default:'' }}">
</div>
