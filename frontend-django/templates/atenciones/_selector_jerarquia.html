<div class="ruta3" id="ruta3"
     data-padre="{{ edit_item.grupo_padre_id }}"
     data-grupo="{{ edit_item.grupo_id }}"
     data-area="{{ edit_item.area_id }}">
  <div>
    <label for="sel-padre">Grupo Padre</label>
    <select id="sel-padre" name="grupo_padre_id">
      <option value="">—</option>
    </select>
  </div>
  <div>
    <label for="sel-grupo">Grupo</label>
    <select id="sel-grupo" name="grupo_id">
      <option value="">—</option>
    </select>
  </div>
  <div>
    <label for="sel-area">Área</label>
    <select id="sel-area" name="area_id" required>
      <option value="">—</option>
    </select>
  </div>
</div>
<script>
(function () {
  const ARBOL = {{ arbol_json|safe }};
  const root = document.getElementById("ruta3");
  const selP = root.querySelector("#sel-padre");
  const selG = root.querySelector("#sel-grupo");
  const selA = root.querySelector("#sel-area");

  const gruposDe = (pid) => ARBOL.grupos.filter((g) => g.grupo_padre_id == pid);
  const areasDe = (gid, pid) =>
    ARBOL.areas.filter((a) =>
      gid ? a.grupo_id == gid : a.grupo_padre_id == pid && !a.grupo_id
    );

  function llenarGrupos(pid) {
    selG.length = 1;
    gruposDe(pid).forEach((g) => selG.add(new Option(g.nombre, g.id)));
  }
  function llenarAreas(gid, pid) {
    selA.length = 1;
    areasDe(gid, pid).forEach((a) => selA.add(new Option(a.nombre, a.id)));
  }

  selP.onchange = () => {
    llenarGrupos(selP.value);
    llenarAreas("", selP.value);
  };
  selG.onchange = () => llenarAreas(selG.value, selP.value);

  ARBOL.padres.forEach((p) => selP.add(new Option(p.nombre, p.id)));

  const preP = root.dataset.padre;
  const preG = root.dataset.grupo;
  const preA = root.dataset.area;
  if (preP) {
    selP.value = preP;
    llenarGrupos(preP);
    if (preG) {
      selG.value = preG;
      llenarAreas(preG, preP);
    } else {
      llenarAreas("", preP);
    }
    if (preA) selA.value = preA;
  }
})();
</script>
