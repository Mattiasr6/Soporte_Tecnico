# DEV mirror: api 5012, web 8011. pg en 5434 para no chocar con prod.
# PENDIENTE al migrar: dev hoy usa localhost:5433/soporte_dev del cluster
# compartido -> cambiar a localhost:5434/soporte_dev (paso con tu OK, no hoy).
name: soporte-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-soporte_dev}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ../../backend-fastapi
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5012", "--reload"]
    env_file: [.env.dev]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-soporte_dev}
    volumes:
      - ../../backend-fastapi:/app
    ports:
      - "127.0.0.1:5012:5012"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../../frontend-django
    command: ["python", "manage.py", "runserver", "0.0.0.0:8011"]
    env_file: [.env.dev]
    environment:
      FASTAPI_URL: http://api:5012
    volumes:
      - ../../frontend-django:/app
    ports:
      - "8011:8011"
    depends_on: [api]

volumes:
  pgdata-dev:
