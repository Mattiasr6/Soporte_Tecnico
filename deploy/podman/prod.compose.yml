# PROD mirror: mismos puertos que systemd hoy (api 5002, web 8001, pg 5433).
# NO prender hasta el cutover (backup + restore test + DNS). Solo validar con:
#   podman-compose -f prod.compose.yml config
name: soporte-prod

services:
  db:
    image: docker.io/postgres:16-alpine
    network_mode: host
    command: ["postgres", "-p", "5433"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-soporte}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    ports:
      - "5433:5432" # igual que hoy: la API usa localhost:5433 sin cambiar .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p 5433"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ../../backend-fastapi
    network_mode: host
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "5002"]
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5433/${POSTGRES_DB:-soporte}
    volumes:
      # Nómina y horarios viven acá: sin volumen se pierden en cada deploy.
      - appdata-prod:/app/data
    ports:
      - "127.0.0.1:5002:5002"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../frontend-django
    network_mode: host
    env_file: [.env.prod]
    environment:
      FASTAPI_URL: http://127.0.0.1:5002
    ports:
      - "8001:8001"
    depends_on: [api]
    restart: unless-stopped

  # Backup correcto por construccion: vuelca db (prod), NO el zombi.
  pgbackup:
    image: docker.io/postgres:16-alpine
    environment:
      PGHOST: host.containers.internal
      PGPORT: 5433
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-soporte}
    volumes:
      - pgbackups-prod:/backups
    command: >
      sh -c 'while true; do DATE=$$(date +%Y%m%d_%H%M%S);
      pg_dump -Fc > /backups/soporte_$$DATE.dump &&
      echo "backup $$DATE OK" || echo "backup $$DATE FALLO" >&2;
      find /backups -name "soporte_*.dump" -mtime +7 -delete;
      sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: docker.io/caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    profiles: ["edge"] # solo cuando el DNS apunte a este equipo

volumes:
  pgdata-prod:
  pgbackups-prod:
  appdata-prod:
  caddy-data:
