# UPDS integration dev stack (feat/sistemas-upds-dev): api 5013, web 8013, pg 5435.
# Isolated from prod (soporte-prod) and dev (soporte-dev): own project name,
# own volume and own database. Mounts the checkout this file lives in.
name: soporte-upds

services:
  db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-soporte_upds}
    volumes:
      - pgdata-upds:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ../../backend-fastapi
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5013", "--reload"]
    env_file: [.env.upds]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-soporte_upds}
      # Angular dev server (frontend-horarios, `ng serve`).
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    volumes:
      - ../../backend-fastapi:/app
    ports:
      - "127.0.0.1:5013:5013"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../../frontend-django
    command: ["python", "manage.py", "runserver", "0.0.0.0:8013"]
    env_file: [.env.upds]
    environment:
      FASTAPI_URL: http://api:5013
    volumes:
      - ../../frontend-django:/app
    ports:
      - "127.0.0.1:8013:8013"
    depends_on: [api]

volumes:
  pgdata-upds:
