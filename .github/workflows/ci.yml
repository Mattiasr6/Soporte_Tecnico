name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI corre en máquinas de GitHub, nunca toca prod.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-fastapi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deps
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Tests unitarios (sin DB real)
        run: DATABASE_URL='postgresql+psycopg://x:x@localhost:5432/soporte_test' python -m pytest tests/test_ia_unit.py -q
